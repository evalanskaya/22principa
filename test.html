 {q:'Если другой человек делает дело не так, как вы ожидали…',a:[['Думаю, что плохо объяснила','guilt',1],['Переделываю сама','burden',2],['Не говорю, что меня не устроило','silence',1],['Переживаю, как это выглядит','approval',1]]},
 {q:'Почему бывает трудно отдыхать?',a:[['Кажется, что подвожу кого-то','guilt',2],['Всегда остаётся что-то несделанное','burden',2],['Не хочу отвечать на вопросы о своём отдыхе','silence',1],['Боюсь показаться ленивой','approval',1]]},
 {q:'Что вы чувствуете, когда вас просят о помощи в неподходящий момент?',a:[['Виноватой за желание отказать','guilt',2],['Что всё равно придётся справиться','burden',2],['Стараюсь не показывать раздражение','silence',1],['Думаю, как меня оценят','approval',1]]},
 {q:'Какой навык вам сейчас нужнее?',a:[['Разрешать себе отказывать','guilt',2],['Делегировать и отдыхать','burden',2],['Просить напрямую','silence',2],['Меньше зависеть от одобрения','approval',2]]}
 ],

function track(name,details={}){try{window.dispatchEvent(new CustomEvent('eva:quiz',{detail:{event:name,...details}}));if(typeof window.ym==='function'&&window.EVA_METRIKA_ID)window.ym(window.EVA_METRIKA_ID,'reachGoal',name)}catch(e){}}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mount(html){app.innerHTML=`<section class="screen">${html}</section>`;window.scrollTo({top:0,behavior:'smooth'})}

function winner(sums){return keys.slice().sort((a,b)=>sums[b]-sums[a]||keys.indexOf(a)-keys.indexOf(b))[0]}
function tier(value){return value>=7?'Ярко выраженная тенденция':value>=4?'Умеренная тенденция':'Тенденция проявляется в отдельных ситуациях'}
function welcome(){stage='welcome';mount(`<p class="eyebrow">Небольшая встреча с собой</p><h1>А вы действительно<br><i>выбираете себя?</i></h1><p class="lead">Иногда мы так хорошо слышим желания других, что перестаём замечать собственные. Ответьте на несколько вопросов и посмотрите, какие привычки могут влиять на ваши решения.</p><div class="pill-row"><span class="pill">10 вопросов</span><span class="pill">2 части</span><span class="pill">Ваш личный результат</span><span class="pill">Бесплатно</span></div><button class="primary" id="start">Узнать о себе <span aria-hidden="true">→</span></button><p class="smallprint">Это тест для размышления, а не психологическая диагностика. Здесь нет правильных или неправильных ответов.</p>`);document.getElementById('start').onclick=()=>{answers=[];branch=null;activeQ=0;track('quiz_start');question()}}
function question(){stage='question';const q=activeQ<5?first[activeQ]:second[branch][activeQ-5];const part=activeQ<5?'Часть I · Что вы привыкли делать':'Часть II · Что за этим стоит';mount(`<div class="progress-top"><span>${part}</span><span>${activeQ+1} / 10</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${activeQ}"><div style="width:${activeQ*10}%"></div></div><p class="eyebrow">Вопрос ${activeQ+1}</p><h2>${safe(q.q)}</h2><p class="lead" style="font-size:14px;margin-bottom:0">Выберите ответ, который чаще всего бывает ближе к вашей реальности.</p><div class="answer-list">${q.a.map(([label],i)=>`<button class="answer" data-answer="${i}"><span>${safe(label)}</span><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>`).join('')}</div>${activeQ>0?'<button class="back" id="back">← Предыдущий вопрос</button>':''}`);
  app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const i=Number(b.dataset.answer);const [label,type,weight]=q.a[i];answers[activeQ]={label,type,weight};activeQ++;locked=false;track('quiz_answer',{step:activeQ});if(activeQ===5){branch=winner(score(answers.slice(0,5)));analyze('first',()=>interim())}else if(activeQ===10){analyze('final',()=>finish())}else question()});
  const back=document.getElementById('back');if(back)back.onclick=()=>{if(activeQ===5){activeQ=4;branch=null}else activeQ--;answers=answers.slice(0,activeQ);question()};
}
function analyze(mode,next){stage='analysis';const my=++epoch;const messages=mode==='first'?['Сопоставляем ваши ответы','Ищем повторяющиеся ситуации','Формируем первый вывод']:['Сравниваем обе части теста','Выделяем ведущие привычки','Готовим рекомендации'];mount(`<div class="thought"><p class="eyebrow">${mode==='first'?'Первые наблюдения':'Ваш личный результат'}</p><div class="spinner" aria-hidden="true"><span>Е</span></div><h2>Анализируем ответы<span class="dots"></span></h2><p class="lead" style="margin:0 auto 24px;max-width:410px">Не спешите. Иногда несколько честных ответов помогают посмотреть на привычную ситуацию по-новому.</p><p class="analysis-step" id="analysis-step">${messages[0]}</p><div class="progress" style="max-width:260px;margin:20px auto"><div id="analysis-progress" style="width:12%"></div></div><div class="step-line">${mode==='first'?'Шаг 1 из 2':'Шаг 2 из 2'}</div></div>`);let i=0;const tick=()=>{if(my!==epoch)return;i++;const txt=document.getElementById('analysis-step'),pr=document.getElementById('analysis-progress');if(txt)txt.textContent=messages[Math.min(i,2)];if(pr)pr.style.width=(i===1?54:100)+'%';if(i<2)setTimeout(tick,700);else setTimeout(()=>{if(my===epoch)next()},520)};setTimeout(tick,650)}
function interim(){stage='interim';const d=TYPES[branch];track('quiz_intermediate',{category:branch});mount(`<p class="eyebrow">Часть I завершена</p><div class="card"><span class="result-label">Ваш первый вывод</span><h2>${safe(d.title)}</h2><p>${safe(d.intro)}</p><div class="quote">«Выбирать себя — не значит перестать заботиться о других»</div><p>Но это только первая часть картины. Давайте посмотрим, <span class="emphasis">что именно стоит за этой привычкой</span> и какие ситуации повторяются чаще всего.</p><div class="divider"></div><button class="primary" id="continue" style="width:100%">Продолжить · ещё 5 вопросов <span aria-hidden="true">→</span></button><p class="smallprint" style="text-align:center">Вторая часть подстроена под ваши ответы.</p></div>`);document.getElementById('continue').onclick=()=>{track('quiz_second_start',{category:branch});question()}}
function finish(){stage='finish';const sums=score(answers);const max=winner(sums),d=TYPES[max];const scored=Object.entries(sums).sort((a,b)=>b[1]-a[1]);const secondary=scored[1][0];const intensity=tier(sums[max]);track('quiz_complete',{category:max,score:sums[max]});mount(`<p class="eyebrow">Ваш персональный результат</p><div class="card"><span class="result-label">${safe(intensity)}</span><h2>${safe(d.title)}</h2><p>${safe(d.intro)}</p><div class="divider"></div><h3>Что важно заметить</h3><p>${safe(d.deeper)}</p><p>Также в ваших ответах встречалась тема «${safe(TYPES[secondary].short.toLowerCase())}». Привычки могут сочетаться — вы не обязаны вписываться в одну категорию.</p><div class="recommend"><strong>Ваш первый маленький шаг</strong><p>${safe(d.advice)}</p></div><p class="smallprint">Результат построен на выбранных вариантах ответов. Он не описывает вашу личность целиком и не является диагностикой.</p></div><div class="card" style="margin-top:22px"><p class="eyebrow">Не просто понять. Начать менять.</p><h2>22 принципа, чтобы чаще выбирать себя</h2><p>${safe(d.book)}</p><div class="book"><div class="book-cover" aria-hidden="true"><small>ЕВА ЛАНСКАЯ</small><b>Женщина,<br>которая<br>выбирает<br>себя</b><small>22 ПРИНЦИПА</small></div><div class="book-copy"><h3>От понимания — к действиям</h3><p>Электронная книга с конкретными принципами и практическими заданиями.</p><div class="price">490 ₽</div></div></div><a class="primary" href="./payment.html" id="buy" style="width:100%">Получить электронную книгу · 490 ₽ <span aria-hidden="true">→</span></a><p class="smallprint" style="text-align:center">После подтверждения оплаты книга будет отправлена на указанный email в течение 1 часа.</p></div><button class="back" id="restart" style="align-self:start">↺ Пройти тест заново</button>`);document.getElementById('buy').addEventListener('click',()=>track('quiz_buy_click',{category:max}));document.getElementById('restart').onclick=()=>{epoch++;welcome()}}
welcome();
</script>
</body>
</html>
