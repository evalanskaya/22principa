 guilt:{title:'Вы часто выбираете чужое спокойствие вместо своего',short:'Чувство вины',intro:'В ваших ответах заметна тенденция соглашаться, даже когда вам неудобно. Возможно, после отказа вы начинаете сомневаться, не поступили ли эгоистично.',deeper:'Когда вы ставите границу, неприятное чувство не обязательно означает, что граница неправильная. Можно заботиться о других и учитывать собственные потребности.',advice:'В следующий раз попробуйте сказать: «Сегодня не смогу». Не добавляйте оправданий, если они не нужны по ситуации.',book:'В книге есть принцип «Нет не требует длинной истории» и практика, которая поможет отказывать без бесконечных объяснений.'},

 {q:'Подруга зовёт вас встретиться, но вы очень устали. Что ближе?',a:[['Соглашаюсь, чтобы не обидеть её','guilt',2],['Встречусь: вдруг без меня ей будет сложно','burden',2],['Не решаюсь сказать, что не хочу','silence',2],['Спрашиваю, не будет ли она разочарована','approval',2]]},

 {q:'Представьте, что у вас появился полностью свободный вечер. Какая мысль возникнет первой?',a:[['«Не эгоистично ли потратить его только на себя?»','guilt',2],['«Сначала нужно закончить все дела»','burden',2],['«Главное, чтобы никто не был против»','silence',2],['«А что другие подумают о моих планах?»','approval',2]]},
 {q:'Что вы чаще говорите себе после трудного разговора?',a:[['«Наверное, я слишком многого хочу»','guilt',2],['«Надо было самой со всем справиться»','burden',2],['«Лучше бы я вообще ничего не говорила»','silence',2],['«Интересно, как теперь ко мне относятся»','approval',2]]}

 ],

 {q:'Когда домашние дела копятся, что вы обычно делаете?',a:[['Чувствую вину за незавершённое','guilt',1],['Беру всё под свой контроль','burden',2],['Молча делаю, чтобы не спорить','silence',1],['Надеюсь, что усилия оценят','approval',1]]},

 ],

function activateReviews(category){

  frame=0;

  const center=box.left+box.width/2;
  let best=0,dist=Infinity;
  cards.forEach((card,i)=>{
   const r=card.getBoundingClientRect();
   const d=Math.abs(r.left+r.width/2-center);
   const near=Math.max(0,1-d/(r.width+15));
   card.style.setProperty('--focus',near.toFixed(3));
   card.classList.toggle('is-active',near>.9);
   if(d<dist){dist=d;best=i}
  });

  counter.textContent=`${current+1} из ${cards.length}`;
  fill.style.width=`${(current+1)/cards.length*100}%`;
  prev.disabled=current===0;next.disabled=current===cards.length-1;

 }

 next.addEventListener('click',()=>go(current+1));

}
